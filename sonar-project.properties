sonar.projectKey=reservalab-dev
sonar.projectName=ReservaLab DEV
sonar.projectVersion=1.0.0
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura crítica se mide en estos cuatro archivos; el resto sigue analizándose estáticamente.
sonar.coverage.exclusions=backend/src/app.js,backend/src/db.js,backend/src/server.js,frontend/src/main.jsx,frontend/src/style.css
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
